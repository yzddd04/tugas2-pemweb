<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Farming Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f7fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .dashboard-title {
      color: #333;
      font-weight: 700;
      margin-bottom: 30px;
    }

    .sensor-card {
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin: 10px 0;
      background: white;
      height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .sensor-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .sensor-label {
      font-size: 14px;
      font-weight: 600;
      color: #666;
      margin-bottom: 8px;
    }

    .sensor-value {
      font-size: 24px;
      font-weight: bold;
      margin-top: 5px;
    }

    .sensor-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.3;
      font-size: 18px;
    }

    .progress-bar-container {
      margin-top: 8px;
      height: 4px;
      background-color: #e9ecef;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: #007bff;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    /* Responsive adjustments */
    @media (max-width: 1200px) {
      .sensor-label {
        font-size: 12px;
      }

      .sensor-value {
        font-size: 20px;
      }
    }

    @media (max-width: 768px) {
      .sensor-card {
        height: auto;
        min-height: 100px;
        padding: 15px;
      }

      .sensor-label {
        font-size: 13px;
      }

      .sensor-value {
        font-size: 22px;
      }

      .dashboard-title {
        font-size: 1.5rem;
        margin-bottom: 20px;
      }
    }

    @media (max-width: 576px) {
      .sensor-card {
        padding: 18px;
        min-height: 90px;
      }

      .sensor-label {
        font-size: 12px;
      }

      .sensor-value {
        font-size: 20px;
      }

      .sensor-icon {
        font-size: 16px;
        right: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="container py-4">
    <h3 class="dashboard-title">Smart Farming</h3>

    <!-- Row 1 -->
    <div class="row g-3 mb-3">
      <!-- Kelembaban -->
      <div class="col-12 col-sm-6 col-md-4 col-lg">
        <div class="sensor-card border-start border-primary border-4">
          <div class="sensor-label">KELEMBABAN (RH)</div>
          <div class="sensor-value text-primary">54 %</div>
          <div class="sensor-icon">☰</div>
        </div>
      </div>

      <!-- TDS -->
      <div class="col-12 col-sm-6 col-md-4 col-lg">
        <div class="sensor-card border-start border-success border-4">
          <div class="sensor-label">TDS</div>
          <div class="sensor-value">400 ppm</div>
          <div class="sensor-icon">☰</div>
        </div>
      </div>

      <!-- Kekeruhan -->
      <div class="col-12 col-sm-6 col-md-4 col-lg">
        <div class="sensor-card border-start border-info border-4">
          <div class="sensor-label">KEKERUHAN (TURBID)</div>
          <div class="sensor-value">18 NTU</div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" style="width: 20%;"></div>
          </div>
          <div class="sensor-icon">☰</div>
        </div>
      </div>

      <!-- Temperatur Air -->
      <div class="col-12 col-sm-6 col-md-6 col-lg">
        <div class="sensor-card border-start border-warning border-4">
          <div class="sensor-label">TEMPERATUR AIR (WTEMP)</div>
          <div class="sensor-value">25 °C</div>
          <div class="sensor-icon">☰</div>
        </div>
      </div>

      <!-- Aliran Air -->
      <div class="col-12 col-sm-6 col-md-6 col-lg">
        <div class="sensor-card border-start border-danger border-4">
          <div class="sensor-label">ALIRAN AIR (WFLOW)</div>
          <div class="sensor-value">34</div>
          <div class="sensor-icon">☰</div>
        </div>
      </div>
    </div>

    <!-- Row 2 -->
    <div class="row g-3">
      <!-- Oksigen -->
      <div class="col-12 col-sm-6 col-md-4 col-lg">
        <div class="sensor-card border-start border-primary border-4">
          <div class="sensor-label">OKSIGEN TERLARUT</div>
          <div class="sensor-value">10 ppm</div>
          <div class="sensor-icon">☰</div>
        </div>
      </div>

      <!-- Intensitas Cahaya -->
      <div class="col-12 col-sm-6 col-md-4 col-lg">
        <div class="sensor-card border-start border-success border-4">
          <div class="sensor-label">INTENSITAS CAHAYA (LUX)</div>
          <div class="sensor-value">100 Lux</div>
          <div class="sensor-icon">☰</div>
        </div>
      </div>

      <!-- Temperatur Udara -->
      <div class="col-12 col-sm-6 col-md-4 col-lg">
        <div class="sensor-card border-start border-info border-4">
          <div class="sensor-label">TEMPERATUR UDARA (AMTEMP)</div>
          <div class="sensor-value">34 °C</div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" style="width: 60%;"></div>
          </div>
          <div class="sensor-icon">☰</div>
        </div>
      </div>

      <!-- EC -->
      <div class="col-12 col-sm-6 col-md-6 col-lg">
        <div class="sensor-card border-start border-warning border-4">
          <div class="sensor-label">EC</div>
          <div class="sensor-value">2</div>
          <div class="sensor-icon">☰</div>
        </div>
      </div>

      <!-- PH -->
      <div class="col-12 col-sm-6 col-md-6 col-lg">
        <div class="sensor-card border-start border-danger border-4">
          <div class="sensor-label">PH</div>
          <div class="sensor-value">7.1</div>
          <div class="sensor-icon">☰</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
